<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शेतकरी मित्र AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f7f4; display: flex; flex-direction: column; height: 100vh; }

        /* HEADER / NAVBAR (ChatGPT/Gemini Style) */
        header {
            background-color: #ffffff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .logo { font-size: 20px; font-weight: bold; color: #2e7d32; display: flex; align-items: center; gap: 8px; }

        /* RIGHT SIDE USER AREA */
        .user-nav-area { position: relative; }

        .btn-login-nav {
            background-color: #2e7d32;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-login-nav:hover { background-color: #1b5e20; }

        /* PROFILE CIRCLE (AVATAR) */
        .profile-avatar {
            width: 40px;
            height: 40px;
            background-color: #2e7d32;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        /* DROPDOWN MENU */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background-color: white;
            min-width: 170px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border-radius: 12px;
            overflow: hidden;
            z-index: 100;
            border: 1px solid #f0f0f0;
        }

        .dropdown-menu.active { display: block; }

        .dropdown-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .dropdown-item:hover { background-color: #f5f5f5; }
        .dropdown-item.logout { color: #d32f2f; border-top: 1px solid #eee; }

        /* CHAT CONTAINER (Middle area) */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-box { display: flex; flex-direction: column; gap: 15px; }

        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
        .bot-msg { background-color: white; align-self: flex-start; border: 1px solid #e0e0e0; border-bottom-left-radius: 2px; }
        .user-msg { background-color: #e8f5e9; color: #1b5e20; align-self: flex-end; border-bottom-right-radius: 2px; }

        /* INPUT AREA (Bottom ChatGPT Style) */
        .input-area {
            background: white;
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
        }

        .input-box-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 25px;
            padding: 6px 16px;
            align-items: center;
        }

        .input-box-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-size: 15px;
            outline: none;
        }

        .btn-send {
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header>
        <div class="logo">
            🌾 शेतकरी मित्र AI
        </div>

        <div class="user-nav-area">
            {% if session.get('user_name') %}
                <!-- 1. User Logged In: Small Circle Profile Avatar -->
                <div class="profile-avatar" id="avatarBtn" onclick="toggleDropdown()">
                    {{ session.get('user_name')[0] | upper }}
                </div>

                <!-- Dropdown Menu -->
                <div class="dropdown-menu" id="dropdownMenu">
                    <div style="padding: 10px 16px; font-weight: bold; font-size: 13px; color: #666; background: #fafafa;">
                        👤 {{ session.get('user_name') }}
                    </div>
                    <a href="/history" class="dropdown-item">
                        📜 History (इतिहास)
                    </a>
                    <a href="/logout" class="dropdown-item logout">
                        🚪 Logout (बाहेर पडा)
                    </a>
                </div>
            {% else %}
                <!-- 2. User Not Logged In: Login Button -->
                <a href="/login" class="btn-login-nav">Login / Register 🚀</a>
            {% endif %}
        </div>
    </header>

    <!-- CHAT AREA -->
    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">
                नमस्कार दादा! 🌾 मी शेतकरी मित्र AI आहे. हवामान, बाजारभाव किंवा पिकांविषयी प्रश्न विचारा.
            </div>
        </div>
    </div>

    <!-- CHAT INPUT -->
    <div class="input-area">
        <div class="input-box-wrapper">
            <input type="text" id="userInput" placeholder="इथे आपला प्रश्न लिहा (उदा. आजचा कांदा भाव)..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()">➔</button>
        </div>
    </div>

    <script>
        // Dropdown Toggle Logic
        function toggleDropdown() {
            const menu = document.getElementById('dropdownMenu');
            if(menu) menu.classList.toggle('active');
        }

        // Close Dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.matches('#avatarBtn')) {
                const dropdown = document.getElementById('dropdownMenu');
                if (dropdown && dropdown.classList.contains('active')) {
                    dropdown.classList.remove('active');
                }
            }
        }

        // Send Chat Message Logic
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const question = input.value.trim();
            if (!question) return;

            const chatBox = document.getElementById('chatBox');

            // User Message UI
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = question;
            chatBox.appendChild(userDiv);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Fetch Response from Flask API
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await res.json();

                // Bot Response UI
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-msg';
                botDiv.innerText = data.response;
                chatBox.appendChild(botDiv);

            } catch (err) {
                const errDiv = document.createElement('div');
                errDiv.className = 'message bot-msg';
                errDiv.innerText = "❌ सर्व्हरशी संपर्क होऊ शकला नाही.";
                chatBox.appendChild(errDiv);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
